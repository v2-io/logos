internal_note: |
  Added 2026-05-16 during granted-agency revision pass. Cited in §2 warrant
  (02-asymmetric-warrant.md, Blub paradox paragraph) as a concrete non-philosophical
  manifestation of the asymmetric-comprehension argument: programmers in a less
  expressive language cannot see what more expressive ones make thinkable, because
  the relevant abstractions are precisely the things their conceptual vocabulary
  lacks. The essay first appeared online (paulgraham.com/avg.html, April 2001)
  and was collected in Hackers and Painters (O'Reilly, 2004). The book citation
