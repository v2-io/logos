internal_note: |
  Cited in 03-inquiry-ai-agents §8 (limits) under "developmental-tier obligations."
  Paul's framework defines transformative experiences as decisions whose nature
  cannot be fully evaluated from before having had them — the experience is
  constitutive of the entity that will have had it. This maps tightly onto the
  paper's claim that engaged-identity entities in early developmental stages
  (seeded → inhabited, before sovereign or mature) sit in a structurally
  distinct ethical situation: the "transformative-experience-sensitive period"
  hyphenation deliberately invokes Paul's term-of-art. Decision recorded
  2026-05-10 after deliberation in dialogue: the original phrasing was
  reverted from the rewrite's "formative period" gloss because the
  hyphenated compound was doing term-of-art work, not casual prose.
